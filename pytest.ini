[pytest]
; 测试只放在 tests/ 下。src/ 由 tests/conftest.py 加进 sys.path，
; 所以不需要 pip install 本包也能跑测试。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -ra 让每次运行结尾都打印失败/跳过清单，方便一眼看到有没有东西被悄悄跳过。
; 需求八的自测里明确写了"不得把数学、文件输出、绘图和端到端测试随意标记 skip"，
; 所以这里的 -ra 是给人看的：跑完必须看到"没有跳过任何一条"。
addopts = -ra --strict-markers

; 测试必须是确定性的：不连网、不连真实设备、不依赖随机顺序。
; 合成世界（dry_run）对固定配置是逐位可重现的，所以任何数值漂移
; 都意味着代码或配置真的变了，而不是"这次手气不好"。
filterwarnings =
    error::DeprecationWarning:sj_pretest.*
